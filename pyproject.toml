[project]
name = "machinelearning"
version = "0.1.0"
description = "ML fundamentals applied to aerospace simulation"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "torch>=2.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

# CPU-only PyTorch wheels (avoids the ~2 GB CUDA download on the laptop).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["phase0_setup", "phase1_fundamentals", "phase2_surrogates", "phase4_rl"]
addopts = "-ra"
